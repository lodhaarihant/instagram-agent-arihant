name: thoughts4us autopost

# GitHub's cron is unreliable (it ran ~5 times a day instead of 20), so a live
# run does not exit after one pass. loop.sh checks for due posts every 5
# minutes for 5 hours, then this workflow dispatches its own replacement.
# The cron below is only a backup that restarts the chain if it ever breaks;
# the concurrency group means at most one live run is going, one is queued.
on:
  schedule:
    - cron: "33 23 * * *"
    - cron: "33 0-18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would post, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Dry runs get their own group so a manual test can't replace the queued
# live run that carries the chain forward.
concurrency:
  group: thoughts4us-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry' || 'live' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: thoughts4us
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check token and media (dry runs only)
        if: env.DRY != ''
        run: python autopost.py --check

      - name: Dry run
        if: env.DRY != ''
        run: |
          python autopost.py $DRY
          python replybot.py $DRY || true

      - name: Publish loop (5h)
        if: env.DRY == ''
        run: bash loop.sh

      - name: Start the next run
        if: env.DRY == '' && (success() || failure())
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run thoughts4us.yml --ref "${GITHUB_REF_NAME}" -f dry_run=false && exit 0
            sleep 20
          done
          echo "could not start the next run; the cron backup will restart the chain" >&2
          exit 1
