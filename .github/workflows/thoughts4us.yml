name: thoughts4us autopost

# One run shortly after every hour from 05:00 to 00:00 IST (UTC+5:30), which
# is 23:30 to 18:30 UTC. GitHub can start scheduled runs late on busy days;
# autopost.py publishes whatever is due, so a late run still posts, and
# stories more than 2h late are skipped.
on:
  schedule:
    - cron: "33 23 * * *"
    - cron: "33 0-18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would post, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: thoughts4us
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thoughts4us
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check token and media (dry runs only)
        if: env.DRY != ''
        run: python autopost.py --check

      - name: Publish due posts
        run: python autopost.py $DRY

      - name: Answer comments
        run: python replybot.py $DRY
        continue-on-error: true

      - name: Save state
        if: env.DRY == ''
        working-directory: .
        run: |
          git config user.name "thoughts4us-bot"
          git config user.email "actions@users.noreply.github.com"
          git add thoughts4us/state
          git diff --cached --quiet || git commit -m "autopost: update state [skip ci]"
          git push
